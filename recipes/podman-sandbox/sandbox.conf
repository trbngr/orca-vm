# Optional per-repository sandbox settings, sourced by podman-create.sh from its own directory.
# Every value can also be set in the environment; the environment wins.

# Host directories mounted into the sandbox as OVERLAYS (colon-separated, absolute or ~-relative):
# warm caches and local package feeds — reads see the host's copy, writes stay in this sandbox.
#ORCA_SANDBOX_OVERLAYS="~/.cache/pip:~/.npm"

# Ceilings per workspace; the Orca runtime's cgroup (host.nix `orca.memoryMax`) is the box's.
#ORCA_SANDBOX_CPUS=4
#ORCA_SANDBOX_MEMORY=12g
